name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root
      - name: Lint & Format
        run: |
          poetry run flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          poetry run ruff check src/
          poetry run black --check src/
      - name: Type Check
        run: |
          poetry run mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root
      - name: Run Tests
        run: |
          poetry run pytest --cov=src/ --maxfail=1 --disable-warnings -q
