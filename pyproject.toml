[tool.poetry]
name = "examcollector"
version = "0.1.0"
description = "Exam Collector AI system"
authors = ["Your Name <you@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
torch = { version = "2.2.1", extras = ["cu121"] }
sqlalchemy = { version = "^2.0.25", extras = ["postgresql"] }
fastapi = "^0.95.0"
uvicorn = { extras = ["standard"], version = "^0.22.0" }
prometheus-client = "^0.16.0"
cryptography = "^41.0.0"
redis = "^4.5.0"
python-dotenv = "^1.0.0"
python-docx = "^0.8.11"
PyPDF2 = "^3.0.0"
"pdfminer.six" = "^20240524"
scikit-learn = "^1.4.0"
pillow = "^10.0.0"
pytesseract = "^0.3.10"
boto3 = "^1.30.0"
google-cloud-vision = "^3.5.0"
httpx = "^0.25.0"
openai = "^0.27.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
flake8 = "^6.1.0"
ruff = "^0.0.10"
black = "^24.3.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
